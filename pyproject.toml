[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-tonel-smalltalk"
version = "0.2.4"
description = "Tree-sitter grammar for Tonel-exported Smalltalk source files"
readme = "README.md"
license = "MIT"
keywords = ["tree-sitter", "smalltalk", "tonel", "parser"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = ["tree-sitter>=0.22.0"]

[project.urls]
Homepage = "https://github.com/mumez/tree-sitter-tonel-smalltalk"

[project.optional-dependencies]
dev = ["tree-sitter-cli"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
